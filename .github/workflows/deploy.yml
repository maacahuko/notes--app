name: Build & Deploy Notes App

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/notes-app:latest
            docker stop notes-app || true
            docker rm notes-app || true
            docker run -d --name notes-app -p 80:5000 \
              --link postgres:db \
              -e DB_HOST=db \
              -e DB_NAME=notesdb \
              -e DB_USER=postgres \
              -e DB_PASSWORD=postgres \
              ${{ secrets.DOCKER_USERNAME }}/notes-app:latest